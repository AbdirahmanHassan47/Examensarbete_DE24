version: 2

sources:
  - name: gtfs_static
    database: TRAFIK_DATA
    schema: STATIC
    tables:
      - name: metro_routes
        description: "GTFS metro routes (SL) loaded by dlt"
      - name: metro_trips
        description: "GTFS metro trips (SL) loaded by dlt"
      - name: metro_stop_times
        description: "GTFS metro stop_times (SL) loaded by dlt"
      - name: metro_stops
        description: "GTFS metro stops (SL) loaded by dlt"

models:
  - name: stg_metro_routes
    description: "Staging view for GTFS metro routes"
  - name: stg_metro_trips
    description: "Staging view for GTFS metro trips"
  - name: stg_metro_stop_times
    description: "Staging view for GTFS metro stop_times"
  - name: stg_metro_stops
    description: "Staging view for GTFS metro stops"
